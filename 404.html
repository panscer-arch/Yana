<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Страница не найдена — Яна Единорог</title>
    <meta name="theme-color" content="#ff72ad">
    <link rel="icon" type="image/png" href="assets/yana-unicorn-logo.png">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        font-family: Arial, Helvetica, sans-serif;
        color: #241f35;
        background:
          radial-gradient(circle at 20% 18%, rgba(255, 255, 255, .9) 0 8%, transparent 9%),
          radial-gradient(circle at 78% 18%, rgba(255, 255, 255, .8) 0 9%, transparent 10%),
          linear-gradient(135deg, #bdefff 0%, #f9d6ff 48%, #fff0aa 100%);
      }

      main {
        width: min(720px, 100%);
        display: grid;
        gap: 18px;
        justify-items: center;
        padding: 32px;
        border: 3px solid rgba(36, 31, 53, .16);
        border-radius: 8px;
        background: rgba(255, 253, 247, .92);
        text-align: center;
        box-shadow: 0 18px 0 rgba(36, 31, 53, .08);
      }

      img {
        width: min(180px, 60vw);
        border: 3px solid rgba(36, 31, 53, .16);
        border-radius: 50%;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 8vw, 64px);
        line-height: 1;
      }

      p {
        margin: 0;
        color: #6a6079;
        font-size: 18px;
        font-weight: 800;
        line-height: 1.45;
      }

      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border-radius: 8px;
        color: #fff;
        background: linear-gradient(180deg, #ff72ad, #df4f9a);
        font-weight: 900;
        text-decoration: none;
        box-shadow: 0 8px 0 rgba(36, 31, 53, .12);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/yana-unicorn-logo.png" alt="">
      <h1>Ой, такой страницы нет</h1>
      <p>Единорог не нашёл этот адрес, но можно вернуться в мастерскую Яны.</p>
      <a href="index.html">На главную</a>
    </main>
  </body>
</html>
