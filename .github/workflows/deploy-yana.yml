name: Deploy Yana site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to barbarpatapim.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check static site
        run: node scripts/check-site.mjs

      - name: Install deploy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Configure SSH
        env:
          YANA_DEPLOY_KEY: ${{ secrets.YANA_DEPLOY_KEY }}
          YANA_DEPLOY_KEY_B64: ${{ secrets.YANA_DEPLOY_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$YANA_DEPLOY_KEY_B64" ]; then
            printf '%s' "$YANA_DEPLOY_KEY_B64" | base64 -d > ~/.ssh/yana_deploy_key
          else
            printf '%s\n' "$YANA_DEPLOY_KEY" > ~/.ssh/yana_deploy_key
          fi
          chmod 600 ~/.ssh/yana_deploy_key
          printf '%s\n' '145.223.90.93 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBc30Sj0RdjjjQb2G6aN7XOkxAAEbxuVwjwex9jTEUdE' > ~/.ssh/known_hosts

      - name: Check server access
        run: |
          ssh -i ~/.ssh/yana_deploy_key deploy-yana@145.223.90.93 \
            'whoami && test -w /var/www/yana && echo "$USER can write /var/www/yana"'

      - name: Upload site
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/yana_deploy_key" \
            ./ deploy-yana@145.223.90.93:/var/www/yana/

      - name: Mark deployment
        run: |
          ssh -i ~/.ssh/yana_deploy_key deploy-yana@145.223.90.93 \
            "printf '%s\n' '${GITHUB_SHA}' > /var/www/yana/.deploy-sha"
