<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Игры Яны</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #27221f;
        --muted: #756b62;
        --paper: #fffaf0;
        --accent: #f06f42;
        --accent-dark: #b9492e;
        --sky: #bde7ff;
        --grass: #72c16a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 18%, rgba(255, 255, 255, .88) 0 8%, transparent 9%),
          radial-gradient(circle at 78% 16%, rgba(255, 255, 255, .82) 0 9%, transparent 10%),
          linear-gradient(180deg, var(--sky) 0 58%, #9bd978 58% 100%);
      }

      main {
        width: min(1040px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }

      .hero {
        display: grid;
        gap: 18px;
        max-width: 720px;
        padding: 34px 0 26px;
      }

      h1 {
        margin: 0;
        font-size: clamp(42px, 8vw, 82px);
        line-height: .95;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.45;
      }

      .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
        margin-top: 28px;
      }

      .game-card {
        display: grid;
        gap: 14px;
        min-height: 220px;
        padding: 20px;
        border: 3px solid rgba(39, 34, 31, .12);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: 0 16px 0 rgba(39, 34, 31, .08);
      }

      .game-art {
        min-height: 112px;
        border-radius: 8px;
        background:
          radial-gradient(circle at 30% 58%, #ffffff 0 15%, transparent 16%),
          radial-gradient(circle at 37% 50%, #ffffff 0 11%, transparent 12%),
          radial-gradient(circle at 72% 54%, #9b5838 0 16%, transparent 17%),
          radial-gradient(circle at 68% 46%, #9b5838 0 11%, transparent 12%),
          linear-gradient(180deg, #8ed9ff 0 52%, #75c96d 52% 100%);
      }

      h2 {
        margin: 0;
        font-size: 24px;
      }

      a.button {
        width: fit-content;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border-radius: 8px;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        background: linear-gradient(180deg, var(--accent), var(--accent-dark));
      }

      .soon {
        width: fit-content;
        padding: 8px 12px;
        border-radius: 8px;
        color: var(--accent-dark);
        background: rgba(240, 111, 66, .14);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>Игры Яны</h1>
        <p>Здесь будет коллекция всех игр: кошачьи погони, карты, уровни, скины и новые приключения.</p>
      </section>

      <section class="games" aria-label="Список игр">
        <article class="game-card">
          <div class="game-art" aria-hidden="true"></div>
          <h2>Кошачья погоня</h2>
          <p>Луна убегает от Ланы, собирает вкусности и добегает до финиша.</p>
          <span class="soon">Скоро добавим файлы игры</span>
        </article>
      </section>
    </main>
  </body>
</html>
