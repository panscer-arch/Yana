<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кошачья погоня</title>
    <meta name="description" content="Мини-игра Яны: Луна собирает вкусности, убегает от Ланы и добегает до финиша.">
    <meta name="theme-color" content="#ff72ad">
    <link rel="icon" type="image/png" href="../../assets/yana-unicorn-logo.png">
    <style>
      :root {
        --ink: #241f35;
        --muted: #6a6079;
        --paper: #fffdf7;
        --pink: #ff72ad;
        --violet: #8e67ff;
        --blue: #54b8ff;
        --mint: #42c995;
        --sun: #ffd45c;
        --orange: #ff8b45;
        --line: rgba(36, 31, 53, .16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 12%, rgba(255, 255, 255, .9) 0 7%, transparent 8%),
          radial-gradient(circle at 88% 18%, rgba(255, 255, 255, .82) 0 8%, transparent 9%),
          linear-gradient(135deg, #bdefff 0%, #f9d6ff 48%, #fff0aa 100%);
      }

      button,
      select {
        font: inherit;
      }

      .shell {
        width: min(1120px, calc(100% - 24px));
        margin: 0 auto;
        padding: 18px 0 28px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      a {
        color: inherit;
      }

      .back {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        padding: 0 13px;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, .8);
        font-weight: 900;
        text-decoration: none;
      }

      .skip-link {
        position: fixed;
        left: 16px;
        top: 12px;
        z-index: 20;
        transform: translateY(-150%);
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        padding: 0 14px;
        border-radius: 8px;
        color: #fff;
        background: var(--ink);
        font-weight: 900;
        text-decoration: none;
        transition: transform .15s ease;
      }

      .skip-link:focus-visible {
        transform: translateY(0);
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(32px, 7vw, 64px);
        line-height: 1;
      }

      .hero-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) min(360px, 36vw);
        gap: 18px;
        align-items: center;
        width: 100%;
      }

      .hero-art {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border: 4px solid rgba(36, 31, 53, .12);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 14px 0 rgba(36, 31, 53, .08);
      }

      .lead {
        color: var(--muted);
        font-size: 17px;
        font-weight: 800;
      }

      .game-shell {
        display: grid;
        gap: 12px;
      }

      .hud {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .hud div,
      .panel {
        border: 3px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 247, .92);
        box-shadow: 0 12px 0 rgba(36, 31, 53, .08);
      }

      .hud div {
        min-height: 62px;
        display: grid;
        align-content: center;
        padding: 8px 12px;
        font-weight: 900;
      }

      .hud span {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }

      .stage {
        position: relative;
        overflow: hidden;
        height: min(62vh, 540px);
        min-height: 420px;
        border: 4px solid rgba(36, 31, 53, .18);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255,255,255,.04), rgba(36,31,53,.12)),
          center / cover no-repeat url("../../assets/backgrounds/cat-chase-garden.png");
        box-shadow: 0 18px 0 rgba(36, 31, 53, .08);
        outline: none;
      }

      .stage::before,
      .stage::after {
        content: "";
        position: absolute;
        left: -8%;
        right: -8%;
        z-index: 0;
        pointer-events: none;
      }

      .stage::before {
        inset: 0;
        background:
          radial-gradient(ellipse at 48% 82%, rgba(0,0,0,.16), transparent 46%),
          linear-gradient(180deg, transparent 0 58%, rgba(255,237,188,.18) 100%);
      }

      .stage::after {
        display: none;
      }

      .scenery {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      .scenery i {
        position: absolute;
        display: block;
      }

      .tree {
        bottom: 95px;
        width: 98px;
        height: 154px;
        background:
          radial-gradient(circle at 52% 25%, #49a85b 0 33%, transparent 34%),
          radial-gradient(circle at 28% 46%, #5fbe68 0 27%, transparent 28%),
          radial-gradient(circle at 74% 48%, #3f9852 0 30%, transparent 31%),
          linear-gradient(90deg, transparent 43%, #9a653a 44% 57%, transparent 58%);
        filter: drop-shadow(0 10px 0 rgba(36,31,53,.08));
      }

      .tree.left { left: 22px; }
      .tree.right { right: 122px; transform: scale(.82); transform-origin: bottom center; }

      .flower {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background:
          radial-gradient(circle, #ffd45c 0 18%, transparent 19%),
          radial-gradient(circle at 50% 0, #fff 0 18%, transparent 19%),
          radial-gradient(circle at 100% 50%, #fff 0 18%, transparent 19%),
          radial-gradient(circle at 50% 100%, #fff 0 18%, transparent 19%),
          radial-gradient(circle at 0 50%, #fff 0 18%, transparent 19%);
      }

      .flower.one { left: 18%; bottom: 72px; }
      .flower.two { left: 52%; bottom: 98px; transform: scale(.8); }
      .flower.three { right: 18%; bottom: 62px; transform: scale(1.12); }

      .butterfly {
        top: 24%;
        width: 30px;
        height: 22px;
        animation: flutter 3.4s ease-in-out infinite;
      }

      .butterfly::before,
      .butterfly::after {
        content: "";
        position: absolute;
        top: 2px;
        width: 15px;
        height: 18px;
        border-radius: 70% 70% 40% 40%;
        background: rgba(255, 114, 173, .82);
      }

      .butterfly::before { left: 0; transform: rotate(-22deg); }
      .butterfly::after { right: 0; transform: rotate(22deg); }
      .butterfly.one { left: 41%; }
      .butterfly.two { right: 31%; top: 34%; animation-delay: -1.4s; transform: scale(.82); }

      @keyframes flutter {
        0%, 100% { translate: 0 0; }
        50% { translate: 0 -12px; }
      }

      .stage:focus-visible {
        outline: 4px solid rgba(255, 114, 173, .82);
        outline-offset: 4px;
      }

      .path {
        position: absolute;
        inset: 52% 0 0;
        z-index: 1;
        background:
          radial-gradient(ellipse at 18% 62%, rgba(255,255,255,.28) 0 12%, transparent 13%),
          radial-gradient(ellipse at 58% 42%, rgba(255,255,255,.2) 0 10%, transparent 11%),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, .18) 0 22px, transparent 22px 46px),
          linear-gradient(180deg, #f0d49b, #cf985e);
        clip-path: polygon(0 35%, 32% 20%, 63% 30%, 100% 0, 100% 100%, 0 100%);
      }

      .scenery,
      .path,
      .finish {
        display: none;
      }

      .finish {
        position: absolute;
        z-index: 2;
        right: 28px;
        top: 66px;
        width: 112px;
        height: 264px;
        border-left: 10px solid #6a4029;
        filter: drop-shadow(0 8px 0 rgba(36,31,53,.12));
      }

      .finish::before {
        content: "";
        position: absolute;
        left: 10px;
        top: 0;
        width: 78px;
        height: 54px;
        border: 3px solid var(--ink);
        background:
          conic-gradient(#fff 0 25%, #111 0 50%, #fff 0 75%, #111 0) 0 0 / 26px 26px;
      }

      .finish::after {
        content: "Финиш";
        position: absolute;
        left: -26px;
        bottom: -16px;
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        padding: 0 12px;
        border: 3px solid rgba(36,31,53,.16);
        border-radius: 8px;
        background: rgba(255,255,255,.86);
        color: var(--ink);
        font-weight: 900;
      }

      .item,
      .cat,
      .lana {
        position: absolute;
        transform: translate(-50%, -50%);
      }

      .item {
        z-index: 3;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 3px solid rgba(36, 31, 53, .16);
        border-radius: 50%;
        background:
          radial-gradient(circle at 34% 26%, rgba(255,255,255,.96), rgba(255,255,255,.2) 26%, transparent 27%),
          linear-gradient(180deg, #fffdf7, #ffe9b4);
        font-size: 24px;
        box-shadow: 0 7px 0 rgba(36, 31, 53, .08), 0 10px 24px rgba(255, 139, 69, .18);
        animation: itemBounce 1.7s ease-in-out infinite;
      }

      .item::after {
        content: "";
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 212, 92, .28), transparent 62%);
        z-index: -1;
      }

      .item.taken-pop {
        animation: popAway .28s ease forwards;
      }

      @keyframes itemBounce {
        0%, 100% { translate: 0 0; }
        50% { translate: 0 -6px; }
      }

      @keyframes popAway {
        to { scale: 1.7; opacity: 0; }
      }

      .cat,
      .lana {
        z-index: 4;
        width: 136px;
        height: 104px;
        filter: drop-shadow(0 16px 8px rgba(36,31,53,.22));
        transition: transform .12s ease;
      }

      .cat.running,
      .lana.running {
        animation: runBob .34s ease-in-out infinite;
      }

      .cat.face-left,
      .lana.face-left {
        transform: translate(-50%, -50%) scaleX(-1);
      }

      @keyframes runBob {
        0%, 100% { margin-top: 0; }
        50% { margin-top: -5px; }
      }

      .cat-body,
      .lana-body {
        position: absolute;
        left: 11px;
        bottom: 0;
        width: 66px;
        height: 45px;
        border: 3px solid var(--ink);
        border-radius: 34px 34px 24px 24px;
        background:
          radial-gradient(ellipse at 72% 18%, rgba(255,255,255,.92), transparent 32%),
          #fff;
      }

      .lana-body {
        background:
          radial-gradient(ellipse at 68% 18%, rgba(255, 197, 121, .28), transparent 30%),
          repeating-linear-gradient(105deg, transparent 0 12px, rgba(80, 45, 28, .2) 13px 16px),
          #9b5838;
      }

      .cat-head,
      .lana-head {
        position: absolute;
        right: 0;
        top: 3px;
        width: 48px;
        height: 43px;
        border: 3px solid var(--ink);
        border-radius: 50%;
        background:
          radial-gradient(circle at 68% 25%, rgba(255,255,255,.9), transparent 24%),
          #fff;
      }

      .lana-head {
        background:
          radial-gradient(circle at 70% 24%, rgba(255, 197, 121, .28), transparent 24%),
          repeating-linear-gradient(105deg, transparent 0 9px, rgba(80, 45, 28, .22) 10px 13px),
          #9b5838;
      }

      .cat-head::before,
      .cat-head::after,
      .lana-head::before,
      .lana-head::after {
        content: "";
        position: absolute;
        top: -14px;
        width: 18px;
        height: 21px;
        border: 3px solid var(--ink);
        border-bottom: 0;
        border-radius: 12px 12px 0 0;
        background: inherit;
      }

      .cat-head::before,
      .lana-head::before {
        left: 2px;
        transform: rotate(-28deg);
      }

      .cat-head::after,
      .lana-head::after {
        right: 2px;
        transform: rotate(28deg);
      }

      .eye {
        position: absolute;
        top: 17px;
        width: 9px;
        height: 11px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 34% 28%, #fff 0 18%, transparent 19%),
          #4ab7ff;
      }

      .lana .eye {
        background: #ffd45c;
      }

      .eye.left {
        left: 12px;
      }

      .eye.right {
        right: 12px;
      }

      .cat-head span::after,
      .lana-head span::after {
        content: "";
        position: absolute;
        width: 22px;
        height: 9px;
        border-bottom: 3px solid rgba(36,31,53,.72);
        border-radius: 50%;
        top: 12px;
      }

      .eye.left::after {
        left: 10px;
      }

      .tail {
        position: absolute;
        left: -4px;
        top: 27px;
        width: 36px;
        height: 16px;
        border: 3px solid var(--ink);
        border-right: 0;
        border-radius: 20px 0 0 20px;
        transform: rotate(12deg);
        background: #fff;
      }

      .lana .tail {
        display: none;
      }

      .cat::after,
      .lana::after {
        content: "";
        position: absolute;
        left: 28px;
        bottom: -5px;
        width: 16px;
        height: 12px;
        border-radius: 50%;
        background: var(--ink);
        box-shadow: 29px 0 0 var(--ink);
        opacity: .9;
      }

      .character-sprite {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 158px;
        height: auto;
        display: block;
        transform: translate(-50%, -62%);
        transform-origin: 50% 72%;
        pointer-events: none;
        animation: spriteIdle 2.2s ease-in-out infinite;
      }

      .cat.running .character-sprite,
      .lana.running .character-sprite {
        animation: spriteRun .28s ease-in-out infinite;
      }

      .lana .character-sprite {
        width: 174px;
      }

      @keyframes spriteIdle {
        0%, 100% { transform: translate(-50%, -62%) rotate(-1deg) scale(1); }
        50% { transform: translate(-50%, -68%) rotate(1deg) scale(1.02); }
      }

      @keyframes spriteRun {
        0%, 100% { transform: translate(-50%, -62%) rotate(-4deg) scale(1.04, .96); }
        50% { transform: translate(-50%, -76%) rotate(5deg) scale(.96, 1.05); }
      }

      .cat .tail,
      .cat .cat-body,
      .cat .cat-head,
      .lana .lana-body,
      .lana .lana-head,
      .cat::after,
      .lana::after {
        display: none;
      }

      .message {
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        border: 3px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 247, .92);
        color: var(--muted);
        font-weight: 900;
        text-align: center;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .controls button {
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        background: linear-gradient(180deg, var(--pink), #df4f9a);
        font-weight: 900;
        box-shadow: 0 8px 0 rgba(36, 31, 53, .12);
      }

      .controls button:last-child {
        color: var(--ink);
        background: #fff;
      }

      .touch-pad {
        display: none;
        grid-template-columns: repeat(3, 64px);
        justify-content: center;
        gap: 10px;
        padding: 12px;
        border: 3px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 247, .86);
      }

      .touch-pad button {
        width: 64px;
        height: 58px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        background: linear-gradient(180deg, var(--violet), #6647d8);
        font-size: 24px;
        font-weight: 900;
        box-shadow: 0 7px 0 rgba(36, 31, 53, .12);
        touch-action: none;
        user-select: none;
      }

      .touch-pad button:nth-child(1) {
        grid-column: 2;
      }

      .touch-pad button:nth-child(2) {
        grid-column: 1;
      }

      .touch-pad button:nth-child(3) {
        grid-column: 3;
      }

      .touch-pad button:nth-child(4) {
        grid-column: 2;
      }

      footer {
        padding: 22px 0 4px;
        color: var(--muted);
        text-align: center;
        font-weight: 900;
      }

      footer nav {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      footer a {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        padding: 0 10px;
        border-radius: 8px;
        color: var(--ink);
        background: rgba(255, 255, 255, .72);
        text-decoration: none;
      }

      @media (max-width: 720px) {
        .hero-card {
          grid-template-columns: 1fr;
        }

        .hero-art {
          max-width: 420px;
        }

        .hud,
        .controls {
          grid-template-columns: 1fr 1fr;
        }

        .stage {
          min-height: 360px;
        }

        .touch-pad {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#content">К содержанию</a>
    <main id="content" class="shell">
      <header>
        <div class="hero-card">
          <div>
            <h1>Кошачья погоня</h1>
            <p class="lead">Луна собирает вкусности, убегает от Ланы и добегает до финиша.</p>
          </div>
          <img class="hero-art" src="../../assets/covers/generated/cat-chase.png" alt="" loading="eager">
        </div>
        <a class="back" href="../../index.html#games">Назад к сайту</a>
      </header>

      <section class="game-shell" aria-label="Игра Кошачья погоня">
        <div class="hud" aria-label="Показатели">
          <div><span>Счёт</span><strong id="score">0</strong></div>
          <div><span>Жизни</span><strong id="lives">3</strong></div>
          <div><span>Собрано</span><strong id="collected">0 / 8</strong></div>
          <div><span>Режим</span><strong>Стартовая карта</strong></div>
        </div>

        <div class="stage" id="stage" tabindex="0">
          <div class="scenery" aria-hidden="true">
            <i class="tree left"></i>
            <i class="tree right"></i>
            <i class="flower one"></i>
            <i class="flower two"></i>
            <i class="flower three"></i>
            <i class="butterfly one"></i>
            <i class="butterfly two"></i>
          </div>
          <div class="path"></div>
          <div class="finish"></div>
          <div class="cat" id="luna" aria-label="Луна">
            <img class="character-sprite" src="../../assets/sprites/luna-kitten.png" alt="">
            <div class="tail"></div>
            <div class="cat-body"></div>
            <div class="cat-head"><span class="eye left"></span><span class="eye right"></span></div>
          </div>
          <div class="lana" id="lana" aria-label="Лана">
            <img class="character-sprite" src="../../assets/sprites/lana-kitten.png" alt="">
            <div class="lana-body"></div>
            <div class="lana-head"><span class="eye left"></span><span class="eye right"></span></div>
          </div>
        </div>

        <div class="message" id="message" aria-live="polite">Нажми “Старт” и управляй стрелками или WASD.</div>

        <div class="controls">
          <button id="start" type="button">Старт</button>
          <button id="restart" type="button">Заново</button>
        </div>

        <div class="touch-pad" aria-label="Управление на телефоне">
          <button type="button" data-key="ArrowUp" aria-label="Вверх">↑</button>
          <button type="button" data-key="ArrowLeft" aria-label="Влево">←</button>
          <button type="button" data-key="ArrowRight" aria-label="Вправо">→</button>
          <button type="button" data-key="ArrowDown" aria-label="Вниз">↓</button>
        </div>
      </section>
    </main>

    <footer class="shell">
      <p>Кошачья погоня подключена к мастерской Яны.</p>
      <nav aria-label="Быстрые ссылки в подвале">
        <a href="../../index.html">Главная</a>
        <a href="../index.html">Игры</a>
        <a href="../../school/index.html">Школа</a>
        <a href="../../schedule/index.html">План</a>
        <a href="../../gallery/index.html">Галерея</a>
      </nav>
    </footer>

    <script>
      const stage = document.querySelector("#stage");
      const luna = document.querySelector("#luna");
      const lana = document.querySelector("#lana");
      const scoreEl = document.querySelector("#score");
      const livesEl = document.querySelector("#lives");
      const collectedEl = document.querySelector("#collected");
      const message = document.querySelector("#message");
      const startButton = document.querySelector("#start");
      const restartButton = document.querySelector("#restart");
      const touchButtons = document.querySelectorAll("[data-key]");

      const state = {
        running: false,
        won: false,
        lost: false,
        score: 0,
        combo: 0,
        comboTimer: 0,
        lives: 3,
        collected: 0,
        luna: { x: 135, y: 318 },
        lana: { x: 92, y: 362 },
        keys: new Set(),
        items: [],
        lastLunaX: 135,
        lastLanaX: 92
      };

      const itemKinds = [
        { icon: "🐟", name: "fish" },
        { icon: "🍎", name: "apple" },
        { icon: "🥕", name: "carrot" },
        { icon: "🍄", name: "mushroom" },
        { icon: "⭐", name: "star" },
        { icon: "💎", name: "gem" },
        { icon: "🍓", name: "berry" },
        { icon: "🧁", name: "cake" }
      ];

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function random(min, max) {
        return Math.random() * (max - min) + min;
      }

      function resetItems() {
        state.items.forEach((item) => item.el.remove());
        state.items = [];
        const rect = stage.getBoundingClientRect();
        for (let index = 0; index < 8; index += 1) {
          const kind = itemKinds[index % itemKinds.length];
          const el = document.createElement("div");
          el.className = `item item-${kind.name}`;
          el.textContent = kind.icon;
          const item = {
            x: random(150, rect.width - 140),
            y: random(115, rect.height - 85),
            el,
            taken: false
          };
          stage.append(el);
          state.items.push(item);
        }
      }

      function resetGame() {
        state.running = false;
        state.won = false;
        state.lost = false;
        state.score = 0;
        state.combo = 0;
        state.comboTimer = 0;
        state.lives = 3;
        state.collected = 0;
        state.luna = { x: 135, y: 318 };
        state.lana = { x: 92, y: 362 };
        state.lastLunaX = state.luna.x;
        state.lastLanaX = state.lana.x;
        resetItems();
        render();
        message.textContent = "Нажми “Старт” и управляй стрелками или WASD.";
      }

      function distance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function updatePlayer() {
        const speed = 4.2;
        const rect = stage.getBoundingClientRect();
        let dx = 0;
        let dy = 0;
        if (state.keys.has("ArrowLeft") || state.keys.has("KeyA")) dx -= 1;
        if (state.keys.has("ArrowRight") || state.keys.has("KeyD")) dx += 1;
        if (state.keys.has("ArrowUp") || state.keys.has("KeyW")) dy -= 1;
        if (state.keys.has("ArrowDown") || state.keys.has("KeyS")) dy += 1;

        if (dx || dy) {
          const length = Math.hypot(dx, dy);
          state.luna.x += (dx / length) * speed;
          state.luna.y += (dy / length) * speed;
        }

        state.luna.x = clamp(state.luna.x, 70, rect.width - 70);
        state.luna.y = clamp(state.luna.y, 45, rect.height - 35);
      }

      function updateLana() {
        const speed = 1.45 + state.collected * 0.06;
        const dx = state.luna.x - state.lana.x;
        const dy = state.luna.y - state.lana.y;
        const length = Math.hypot(dx, dy) || 1;
        state.lana.x += (dx / length) * speed;
        state.lana.y += (dy / length) * speed;
      }

      function checkItems() {
        for (const item of state.items) {
        if (!item.taken && distance(state.luna, item) < 38) {
            item.taken = true;
            item.el.classList.add("taken-pop");
            setTimeout(() => item.el.remove(), 260);
            state.combo = state.comboTimer > 0 ? state.combo + 1 : 1;
            state.comboTimer = 150;
            state.score += 10 + Math.min(30, state.combo * 4);
            state.collected += 1;
            message.textContent = state.combo >= 3 ? `Комбо x${state.combo}! Луна собирает быстрее.` : "Луна собрала вкусность!";
          }
        }
      }

      function checkCatch() {
        if (distance(state.luna, state.lana) > 46) return;
        state.lives -= 1;
        state.luna = { x: 135, y: 318 };
        state.lana = { x: 92, y: 362 };
        state.combo = 0;
        state.comboTimer = 0;
        state.lastLunaX = state.luna.x;
        state.lastLanaX = state.lana.x;
        message.textContent = state.lives > 0 ? "Лана догнала Луну. Осторожнее!" : "Лана поймала Луну. Попробуй ещё раз.";
        if (state.lives <= 0) {
          state.running = false;
          state.lost = true;
        }
      }

      function checkFinish() {
        const rect = stage.getBoundingClientRect();
        const reachedFinish = state.luna.x > rect.width - 95 && state.luna.y < 325;
        if (reachedFinish && state.collected >= state.items.length) {
          state.running = false;
          state.won = true;
          state.score += 50;
          message.textContent = "Победа! Луна собрала всё и добежала до финиша.";
        } else if (reachedFinish) {
          message.textContent = "До финиша можно, но сначала собери все вкусности.";
        }
      }

      function render() {
        luna.style.left = `${state.luna.x}px`;
        luna.style.top = `${state.luna.y}px`;
        lana.style.left = `${state.lana.x}px`;
        lana.style.top = `${state.lana.y}px`;
        luna.classList.toggle("running", state.running && state.keys.size > 0);
        lana.classList.toggle("running", state.running);
        luna.classList.toggle("face-left", state.luna.x < state.lastLunaX - 0.2);
        lana.classList.toggle("face-left", state.lana.x < state.lastLanaX - 0.2);
        state.lastLunaX = state.luna.x;
        state.lastLanaX = state.lana.x;
        for (const item of state.items) {
          item.el.style.left = `${item.x}px`;
          item.el.style.top = `${item.y}px`;
        }
        scoreEl.textContent = state.score;
        livesEl.textContent = "❤️".repeat(Math.max(0, state.lives));
        collectedEl.textContent = `${state.collected} / ${state.items.length}`;
      }

      function loop() {
        if (state.running) {
          state.comboTimer = Math.max(0, state.comboTimer - 1);
          updatePlayer();
          updateLana();
          checkItems();
          checkCatch();
          checkFinish();
          render();
        }
        requestAnimationFrame(loop);
      }

      window.addEventListener("keydown", (event) => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "KeyA", "KeyD", "KeyW", "KeyS"].includes(event.code)) {
          event.preventDefault();
          state.keys.add(event.code);
        }
      });

      window.addEventListener("keyup", (event) => {
        state.keys.delete(event.code);
      });

      window.addEventListener("blur", () => {
        state.keys.clear();
      });

      touchButtons.forEach((button) => {
        const key = button.dataset.key;
        const press = (event) => {
          event.preventDefault();
          state.keys.add(key);
          stage.focus();
        };
        const release = (event) => {
          event.preventDefault();
          state.keys.delete(key);
        };

        button.addEventListener("pointerdown", press);
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("pointerleave", release);
      });

      startButton.addEventListener("click", () => {
        if (state.won || state.lost) resetGame();
        state.running = true;
        message.textContent = "Беги к вкусностям, а потом к финишу!";
        stage.focus();
      });

      restartButton.addEventListener("click", () => {
        resetGame();
        stage.focus();
      });

      resetGame();
      loop();
    </script>
    <script src="../../assets/site.js"></script>
  </body>
</html>
